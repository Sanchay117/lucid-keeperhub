<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121c30"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa7ff"/>
      <stop offset="0.5" stop-color="#58c9cf"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="219" fill="none" stroke="#273449" stroke-width="12"/>

  <!-- the lens: Lucid -->
  <circle cx="512" cy="512" r="248" fill="none" stroke="#e5eaf1" stroke-opacity="0.92" stroke-width="44"/>

  <!-- casings: cut the ring where the flow crosses it -->
  <path d="M232 232 L420 420" stroke="#0f1829" stroke-width="102" stroke-linecap="round"/>
  <path d="M604 604 L770 770" stroke="#0a111d" stroke-width="102" stroke-linecap="round"/>

  <!-- value in, from the buyer -->
  <path d="M232 232 L420 420" stroke="#7aa7ff" stroke-width="58" stroke-linecap="round"/>
  <!-- value out, executed once -->
  <path d="M604 604 L770 770" stroke="#34d399" stroke-width="58" stroke-linecap="round"/>
  <path d="M636 792 L792 792 L792 636" fill="none" stroke="#34d399" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the single point of execution: KeeperHub -->
  <circle cx="512" cy="512" r="150" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="78" fill="url(#flow)"/>
</svg>
